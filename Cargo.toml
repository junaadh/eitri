[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
eitri-types = { path = "crates/eitri-types" }
eitri-base = { path = "crates/eitri-base" }
eitri-bytecode = { path = "crates/eitri-bytecode" }
eitri-check = { path = "crates/eitri-check" }
eitri-diag = { path = "crates/eitri-diag" }
eitri-lower = { path = "crates/eitri-lower" }
eitri-syntax = { path = "crates/eitri-syntax" }
eitri-vm = { path = "crates/eitri-vm" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
disallowed_types = "deny"
